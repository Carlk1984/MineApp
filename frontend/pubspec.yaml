name: mine_kpi_frontend
description: Mine KPI tracking mobile and web application
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  http: ^1.1.0
  
  provider: ^6.1.1
  
  go_router: ^12.1.3
  
  shared_preferences: ^2.2.2
  
  json_annotation: ^4.8.1
  
  cupertino_icons: ^1.0.6
  
  flutter_secure_storage: ^9.0.0
  
  fl_chart: ^0.65.0
  
  intl: ^0.19.0
  
  connectivity_plus: ^5.0.2
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  signature: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
